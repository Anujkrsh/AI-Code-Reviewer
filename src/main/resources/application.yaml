server:
  port: 8899

spring:
  application:
    name: AICodeReviewer

  datasource:
    url: jdbc:h2:mem:reviewdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: update

github:
  token: ${GITHUB_TOKEN:}
  webhook:
    secret: ${GITHUB_WEBHOOK_SECRET:}

gemini:
  key: ${GEMINI_API_KEY:}
  url: https://generativelanguage.googleapis.com/v1beta/interactions
  model: gemini-3-flash-preview
kind: Application
